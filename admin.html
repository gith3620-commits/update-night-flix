<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"><meta name="theme-color" content="#080a0f"><title>NIGHTFLIX Admin</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#080a0f;color:#f4f6fa;font:15px Inter,Arial,sans-serif;padding:20px}
main{max-width:760px;margin:30px auto}.brand{font-size:24px;font-weight:900;letter-spacing:1px}.brand span{color:#e50914}
.panel{margin-top:22px;background:#111720;border:1px solid #293241;border-radius:16px;padding:22px;box-shadow:0 18px 50px #0006}
h1{font-size:22px;margin:0 0 8px}p,.muted{color:#9aa5b5;line-height:1.5}.tabs{display:flex;gap:8px;margin:18px 0;flex-wrap:wrap}
button{cursor:pointer;border:0;border-radius:10px;padding:13px 16px;background:#e50914;color:white;font-weight:800}
button.secondary{background:#202a38;color:#e8edf5}.tabs button{flex:1;min-width:110px}
label{display:block;font-size:13px;font-weight:700;margin:15px 0 7px}
input,textarea{width:100%;background:#090e15;border:1px solid #344052;color:white;border-radius:10px;padding:14px;font:inherit;outline:none}
input:focus,textarea:focus{border-color:#e50914}form button{width:100%;margin-top:20px;min-height:48px}
.hidden{display:none!important}.status{margin-top:14px;padding:12px;border-radius:9px;background:#1a2431;color:#dce5f1;overflow-wrap:anywhere}
.small{font-size:12px}.list{display:grid;gap:10px;margin-top:18px}.item{display:flex;gap:12px;align-items:center;padding:12px;background:#0b1119;border:1px solid #293241;border-radius:10px}.item img{width:52px;height:72px;object-fit:cover;border-radius:6px;background:#202a38}.item div{min-width:0;flex:1}.item strong{display:block;overflow-wrap:anywhere}.item button{padding:8px 10px;background:#263344}
@media(max-width:520px){body{padding:12px}.panel{padding:16px}.tabs button{min-width:0;padding:12px 8px}}
</style></head><body><main>
<div class="brand">NIGHT<span>FLIX</span> <span style="color:#9aa5b5;font-size:12px">ADMIN</span></div>
<section class="panel" id="loginPanel"><h1>Admin login</h1><p>Sign in to manage NIGHTFLIX catalogue.</p>
<label>Admin password</label><input id="password" type="password" autocomplete="current-password" placeholder="Enter admin password">
<button id="loginBtn" style="width:100%;margin-top:16px">Sign in</button><div class="status hidden" id="loginStatus"></div></section>
<section class="panel hidden" id="adminPanel"><div style="display:flex;justify-content:space-between;gap:10px;align-items:center"><div><h1>Content Manager</h1><p class="small">Changes are committed to GitHub.</p></div><button class="secondary" id="logoutBtn">Log out</button></div>
<div class="tabs"><button id="movieTab">Movies</button><button class="secondary" id="shortTab">Shorts</button></div>
<form id="movieForm"><h2>Add movie</h2>
<label>Movie name</label><input id="movieTitle" required maxlength="160" placeholder="Movie title">
<label>Poster image URL</label><input id="moviePoster" type="url" required placeholder="https://...jpg">
<label>Movie MP4 URL</label><input id="movieVideo" type="url" required placeholder="https://...mp4">
<button type="submit">Add movie to GitHub</button></form>
<form id="shortForm" class="hidden"><h2>Add Short</h2>
<label>Short title</label><input id="shortTitle" required maxlength="160" placeholder="Short title">
<label>Poster image URL (optional)</label><input id="shortPoster" type="url" placeholder="https://...jpg">
<label>Short MP4 URL</label><input id="shortVideo" type="url" required placeholder="https://...mp4">
<label>Related Movie ID (optional)</label><input id="shortMovieId" type="number" min="1" placeholder="Movie ID">
<label>Caption (optional)</label><textarea id="shortCaption" rows="2" placeholder="Short description"></textarea>
<button type="submit">Add Short to GitHub</button></form>
<div class="status hidden" id="status"></div><div class="list" id="items"></div>
</section></main>
<script>
const API_BASE = "https://nightflix-admin-api.gith3620.workers.dev";
let password="", mode="movies", movies=[], shorts=[];
const $=id=>document.getElementById(id);
function message(el,msg,err=false){el.textContent=msg;el.classList.remove("hidden");el.style.border=err?"1px solid #e50914":""}
async function api(path,method="GET",body){
 const r=await fetch(API_BASE+path,{method,headers:{"Content-Type":"application/json","Authorization":"Bearer "+password},body:body?JSON.stringify(body):undefined});
 const data=await r.json().catch(()=>({error:"Invalid server response"}));
 if(!r.ok)throw new Error(data.error||"Request failed ("+r.status+")");
 return data;
}
async function refresh(){
 const d=await api("/api/catalog");
 movies=d.movies||[];shorts=d.shorts||[];renderList();
}
function renderList(){
 const arr=mode==="movies"?movies:shorts;
 $("items").innerHTML=arr.map((x,i)=>`<div class="item">${x.poster?`<img src="${escapeHtml(x.poster)}" alt="">`:""}<div><strong>${escapeHtml(x.title||"Untitled")}</strong><span class="muted small">ID: ${escapeHtml(x.id??x.movieId??i)}</span></div><button type="button" onclick="editEntry(${i})">Edit</button><button type="button" onclick="deleteEntry(${i})">Delete</button></div>`).join("")||'<p class="muted">No entries yet.</p>';
}
async function editEntry(index){
 const arr=mode==="movies"?movies:shorts, x=arr[index]; if(!x)return;
 const title=prompt("Title",x.title||""); if(title===null)return;
 const poster=prompt("Poster URL",x.poster||""); if(poster===null)return;
 const video=prompt(mode==="movies"?"Movie MP4 URL":"Short MP4 URL",mode==="movies"?(x.watch||""):(x.video||"")); if(video===null)return;
 const payload=mode==="movies"?{id:x.id,title,poster,watch:video}:{index,title,poster,video,caption:x.caption||"",movieId:x.movieId||null};
 try{const d=await api("/api/"+mode,"PATCH",payload);message($("status"),"Updated on GitHub. Commit: "+d.commit);await refresh();}catch(e){message($("status"),e.message,true);}
}
async function deleteEntry(index){
 if(!confirm("Delete this item from NIGHTFLIX?"))return;
 const x=(mode==="movies"?movies:shorts)[index]; if(!x)return;
 try{const d=await api("/api/"+mode,"DELETE",mode==="movies"?{id:x.id}:{index});message($("status"),"Deleted from GitHub. Commit: "+d.commit);await refresh();}catch(e){message($("status"),e.message,true);}
}
function escapeHtml(v){return String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}
$("loginBtn").onclick=async()=>{try{password=$("password").value;await refresh();$("loginPanel").classList.add("hidden");$("adminPanel").classList.remove("hidden");}catch(e){message($("loginStatus"),e.message,true);}};
$("logoutBtn").onclick=()=>{password="";$("adminPanel").classList.add("hidden");$("loginPanel").classList.remove("hidden");$("password").value="";};
$("movieTab").onclick=()=>{mode="movies";$("movieForm").classList.remove("hidden");$("shortForm").classList.add("hidden");$("movieTab").classList.remove("secondary");$("shortTab").classList.add("secondary");renderList();};
$("shortTab").onclick=()=>{mode="shorts";$("shortForm").classList.remove("hidden");$("movieForm").classList.add("hidden");$("shortTab").classList.remove("secondary");$("movieTab").classList.add("secondary");renderList();};
$("movieForm").onsubmit=async e=>{e.preventDefault();try{const d=await api("/api/movies","POST",{title:$("movieTitle").value.trim(),poster:$("moviePoster").value.trim(),watch:$("movieVideo").value.trim()});$("movieForm").reset();message($("status"),"Movie added. GitHub commit: "+d.commit);await refresh();}catch(e){message($("status"),e.message,true);}};
$("shortForm").onsubmit=async e=>{e.preventDefault();try{const d=await api("/api/shorts","POST",{title:$("shortTitle").value.trim(),poster:$("shortPoster").value.trim(),video:$("shortVideo").value.trim(),movieId:$("shortMovieId").value?Number($("shortMovieId").value):null,caption:$("shortCaption").value.trim()});$("shortForm").reset();message($("status"),"Short added. GitHub commit: "+d.commit);await refresh();}catch(e){message($("status"),e.message,true);}};
</script></body></html>

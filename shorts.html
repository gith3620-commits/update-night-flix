<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#07090d">
<title>NIGHTFLIX — Shorts</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#050608;color:#fff;font-family:Inter,Segoe UI,Arial,sans-serif}button,a{font:inherit}a{color:inherit;text-decoration:none}#app{height:100dvh;width:100%;position:relative;background:#050608}.topbar{position:absolute;z-index:20;top:0;left:0;right:0;height:64px;display:flex;align-items:center;justify-content:space-between;padding:0 20px;background:linear-gradient(#000b,transparent)}.brand{font-size:21px;font-weight:950;letter-spacing:1px}.brand span{color:#e50914}.top-actions{display:flex;gap:9px}.top-btn{border:1px solid #ffffff35;background:#1119;color:#fff;border-radius:30px;padding:9px 13px;font-size:12px;font-weight:700;backdrop-filter:blur(8px)}#feed{height:100%;width:100%;overflow:hidden;position:relative;touch-action:pan-y}.short{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:#08090c}.short video,.poster-bg{position:absolute;width:100%;height:100%;object-fit:contain;background:#000}.poster-bg{object-fit:cover;filter:blur(24px) brightness(.28);transform:scale(1.12)}.short:after{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(0deg,rgba(0,0,0,.88),transparent 35%,rgba(0,0,0,.12) 72%,rgba(0,0,0,.4))}.meta{position:absolute;z-index:3;left:22px;right:90px;bottom:max(35px,env(safe-area-inset-bottom));text-shadow:0 2px 12px #000}.tag{display:inline-block;background:#e50914;border-radius:4px;padding:5px 8px;font-size:10px;font-weight:900;letter-spacing:1px;margin-bottom:10px}.meta h2{font-size:clamp(22px,5vw,30px);margin:0 0 7px;font-weight:900}.meta p{font-size:13px;line-height:1.45;color:#ddd;margin:0;max-width:540px}.side{position:absolute;z-index:4;right:16px;bottom:105px;display:flex;flex-direction:column;gap:17px;align-items:center}.side button{width:48px;height:48px;border-radius:50%;border:1px solid #ffffff50;background:#10131bbd;color:#fff;font-size:20px;display:grid;place-items:center;backdrop-filter:blur(8px)}.side small{font-size:10px;color:#eee;text-align:center}.detail-btn{width:54px!important;height:54px!important;background:#e50914!important;border:0!important;font-size:22px!important}.hint{position:absolute;z-index:5;top:75px;left:50%;transform:translateX(-50%);font-size:11px;color:#ffffffc9;background:#0008;padding:8px 12px;border-radius:20px;white-space:nowrap;pointer-events:none}.empty{height:100%;display:flex;align-items:center;justify-content:center;text-align:center;padding:30px}.empty h2{font-size:25px;margin:0 0 10px}.empty p{color:#aab0bb;font-size:14px;line-height:1.6}.empty a{display:inline-block;margin-top:18px;background:#e50914;padding:12px 18px;border-radius:9px;font-weight:800}.progress{position:absolute;z-index:8;bottom:0;left:0;height:3px;background:#e50914;width:0;transition:width .15s linear}.sound-tip{position:absolute;z-index:5;top:50%;left:50%;transform:translate(-50%,-50%);background:#0009;border-radius:50%;width:66px;height:66px;display:grid;place-items:center;font-size:25px;opacity:0;pointer-events:none;transition:opacity .2s}.sound-tip.show{opacity:1}@media(min-width:700px){.short{background:radial-gradient(ellipse at center,#171a22,#050608 70%)}.short video{height:100%;width:auto;max-width:100%;aspect-ratio:9/16;border-left:1px solid #222;border-right:1px solid #222}.short:after{left:0;right:0}.meta{left:max(calc((100vw - 520px)/2),24px);max-width:420px}.side{right:max(calc((100vw - 520px)/2),24px)}}
</style></head><body><div id="app"><header class="topbar"><a class="brand" href="index.html">NIGHT<span>FLIX</span></a><div class="top-actions"><button class="top-btn" id="soundToggle">🔇 Sound off</button><a class="top-btn" href="index.html">✕ Close</a></div></header><main id="feed" aria-label="Movie shorts feed"><div class="empty"><div><h2>Loading Shorts…</h2><p>Please wait</p></div></div></main><div class="progress" id="progress"></div></div>
<script>
'use strict';
const feed=document.getElementById('feed'),soundToggle=document.getElementById('soundToggle'),progress=document.getElementById('progress');
let shorts=[],movies=[],current=0,muted=true,startX=0,startY=0,startTime=0,progressFrame=null;
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function movieFor(id){return movies.find(m=>String(m.id)===String(id));}
function movieUrl(item){return `movie.html?id=${encodeURIComponent(item.movieId)}`;}
function render(){
 if(!shorts.length){feed.innerHTML='<div class="empty"><div><h2>No Shorts Yet</h2><p>Add licensed short-video URLs in <b>shorts.json</b> to start the feed.<br>Swipe down for the next short · Swipe left to open movie details.</p><a href="index.html">Back to NIGHTFLIX</a></div></div>';return;}
 const item=shorts[current],movie=movieFor(item.movieId)||{},poster=item.poster||movie.poster||'';
 feed.innerHTML=`<section class="short" id="activeShort">${poster?`<img class="poster-bg" src="${esc(poster)}" alt="">`:''}<video id="shortVideo" src="${esc(item.video)}" playsinline webkit-playsinline autoplay loop muted preload="auto" ${poster?`poster="${esc(poster)}"`:''}></video><div class="hint">↓ Next short &nbsp; · &nbsp; ← Movie details</div><div class="meta"><span class="tag">NIGHTFLIX SHORTS</span><h2>${esc(item.title||movie.title||'Movie Short')}</h2><p>${esc(item.caption||movie.description||'Discover this title on NIGHTFLIX.')}</p></div><div class="side"><div><button class="detail-btn" id="openMovie" aria-label="Open movie">↗</button><small>Movie</small></div><div><button id="muteBtn" aria-label="Toggle sound">${muted?'🔇':'🔊'}</button><small>Sound</small></div><div><button id="nextBtn" aria-label="Next short">↓</button><small>Next</small></div></div><div class="sound-tip" id="soundTip">${muted?'🔇':'🔊'}</div></section>`;
 const video=document.getElementById('shortVideo');video.muted=muted;video.play().catch(()=>{});
 document.getElementById('openMovie').onclick=()=>location.href=movieUrl(item);
 document.getElementById('nextBtn').onclick=next;
 document.getElementById('muteBtn').onclick=toggleSound;
 video.addEventListener('timeupdate',()=>{if(video.duration)progress.style.width=(video.currentTime/video.duration*100)+'%'});
 video.addEventListener('ended',next);
 progress.style.width='0%';
}
function next(){if(!shorts.length)return;current=(current+1)%shorts.length;render();}
function previous(){if(!shorts.length)return;current=(current-1+shorts.length)%shorts.length;render();}
function toggleSound(){muted=!muted;const v=document.getElementById('shortVideo');if(v)v.muted=muted;soundToggle.textContent=muted?'🔇 Sound off':'🔊 Sound on';const b=document.getElementById('muteBtn');if(b)b.textContent=muted?'🔇':'🔊';const tip=document.getElementById('soundTip');if(tip){tip.textContent=muted?'🔇':'🔊';tip.classList.add('show');setTimeout(()=>tip.classList.remove('show'),500)}}
soundToggle.addEventListener('click',toggleSound);
feed.addEventListener('touchstart',e=>{const t=e.changedTouches[0];startX=t.clientX;startY=t.clientY;startTime=Date.now()},{passive:true});
feed.addEventListener('touchend',e=>{const t=e.changedTouches[0],dx=t.clientX-startX,dy=t.clientY-startY;if(Math.max(Math.abs(dx),Math.abs(dy))<45)return;if(Math.abs(dx)>Math.abs(dy)){if(dx<0&&shorts[current])location.href=movieUrl(shorts[current]);else if(dx>0)previous();}else{if(dy>0)next();else previous();}},{passive:true});
let wheelLock=false;feed.addEventListener('wheel',e=>{if(wheelLock||Math.abs(e.deltaY)<25)return;wheelLock=true;e.deltaY>0?next():previous();setTimeout(()=>wheelLock=false,450)},{passive:true});
document.addEventListener('keydown',e=>{if(e.key==='ArrowDown')next();if(e.key==='ArrowUp')previous();if(e.key==='ArrowLeft'&&shorts[current])location.href=movieUrl(shorts[current]);if(e.key==='Escape')location.href='index.html';});
(async()=>{try{const [s,m]=await Promise.all([fetch('shorts.json').then(r=>{if(!r.ok)throw Error('shorts.json missing');return r.json()}),fetch('movies.json').then(r=>{if(!r.ok)throw Error('movies.json missing');return r.json()})]);shorts=Array.isArray(s)?s.filter(x=>x&&x.video&&x.movieId!==undefined):[];movies=Array.isArray(m)?m:[];if(!shorts.length){render();return;}const requested=new URLSearchParams(location.search).get('i');if(requested!==null)current=Math.max(0,Math.min(shorts.length-1,Number(requested)||0));render();}catch(err){feed.innerHTML=`<div class="empty"><div><h2>Shorts could not load</h2><p>${esc(err.message)}<br>Keep shorts.json in the same folder as this page.</p><a href="index.html">Back to NIGHTFLIX</a></div></div>`;}})();
</script></body></html>
